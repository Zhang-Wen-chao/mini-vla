[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-vla"
version = "0.1.0"
description = "Teaching pipeline: VLA (flow-matching action head) trained end-to-end on PushT - data, distributed training, distillation, quantization, serving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.1",
    "zarr>=2.17",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["mini_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
